<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>104.3 MYFM</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:-apple-system, sans-serif;
    text-align:center;
}

.container {
    max-width:420px;
    margin:auto;
    padding:20px;
}

#overlay {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:1000;
}

#overlay button {
    font-size:22px;
    padding:15px 30px;
    border-radius:40px;
    border:none;
    background:#ff3b30;
    color:white;
}

img#cover {
    width:100%;
    border-radius:20px;
    margin-top:15px;
}

audio {
    width:100%;
    margin-top:15px;
}

.history {
    margin-top:30px;
    text-align:left;
}

.history h4 {
    font-size:14px;
    color:#aaa;
}

.history-item {
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.history-item img {
    width:50px;
    height:50px;
    border-radius:8px;
    margin-right:10px;
    object-fit:cover;
}

.song-info { overflow:hidden; }

.song-title {
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.updated {
    margin-top:30px;
    font-size:11px;
    color:#555;
}

.song-artist {
    font-size:12px;
    color:#888;
}
</style>
</head>

<body>

<div id="overlay">
    <h2>🎵 104.3 MYFM</h2>
    <button onclick="startPlayback()">Tap to Play</button>
</div>

<div class="container">

<img id="cover">
<h3 id="title">Loading...</h3>
<p id="artist"></p>

<audio id="radio" controls></audio>

<div class="history">
    <h4>RECENTLY PLAYED</h4>
    <div id="historyList"></div>
</div>

<div class="updated">Last updated: 2026-10-27</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>

const STREAM_URL = "https://stream.revma.ihrhls.com/zc173/hls.m3u8";
const STATION_NAME = "104.3 MYFM";
// 멘트/광고 구간 및 커버가 없을 때 쓰는 방송국 이미지 (외부 파일 없이 페이지 안에 내장)
const STATION_LOGO = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">' +
    '<rect width="600" height="600" rx="40" fill="#1c1c1e"/>' +
    '<text x="300" y="300" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="140" font-weight="800" fill="#ff3b30" text-anchor="middle">104.3</text>' +
    '<text x="300" y="430" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="110" font-weight="700" fill="#ffffff" text-anchor="middle">MYFM</text>' +
    '</svg>');
const HISTORY_SIZE = 10;
const HISTORY_STORE = "myfmHistory";
const HISTORY_KEEP_MS = 6 * 60 * 60 * 1000;   // 저장된 기록은 6시간까지만 사용

// "최근 재생" 목록을 채우는 용도 (재생 시각 포함). 직접 들은 기록과 시간순으로 합침
const API_URL =
"https://webapi.radioedit.iheart.com/graphql?operationName=GetCurrentlyPlayingSongs&variables=%7B%22slug%22%3A%22kbig-fm%22%2C%22paging%22%3A%7B%22take%22%3A15%7D%7D&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%22386763c17145056713327cddec890cd9d4fea7558efc56d09b7cd4167eef6060%22%7D%7D";

const audio = document.getElementById("radio");

let currentKey = "";       // 화면에 표시 중인 항목
let currentSong = null;    // 지금 나오는 곡 (멘트/광고 중이면 직전 곡 유지)
let localHistory = loadLocalHistory();  // 실제로 들은 곡 (브라우저에 저장, 새로고침해도 유지)
let apiTracks = [];        // 웹 API의 최근 곡 목록
const debugInfo = {};      // ?debug 화면용

function loadLocalHistory() {
    try {
        const list = JSON.parse(localStorage.getItem(HISTORY_STORE)) || [];
        return list
            .filter(s => s && s.title && Date.now() - s.time < HISTORY_KEEP_MS)
            .map(s => ({ ...s, key: trackKey(s.title, s.artist) }));
    } catch (e) {
        return [];
    }
}

function saveLocalHistory() {
    try {
        localStorage.setItem(HISTORY_STORE, JSON.stringify(localHistory));
    } catch (e) {}
}

// ---------------------------------------------------------------
// 스트림 곡 정보 해석
// 각 10초 조각의 #EXTINF 에 들어있는 내용:
//   title="곡",artist="가수",url="song_spot=\"M\" ... amgArtworkURL=\"https://...\" ..."
// song_spot "M" = 음악
//           "F" = 광고 시간에 대신 나가는 노래 (웹사이트 Recently Played 에는 안 올라옴)
//           "T" = 방송국 멘트/광고/교통·날씨, 그 외(비어있음, "Spot Block End") = 광고 구간
// 같은 내용이 조각 파일 안의 ID3 태그(TIT2/TPE1/WXXX)에도 들어있음
// ---------------------------------------------------------------
function parseExtinf(text) {
    if (!text) return null;
    const attrs = {};
    const re = /(\w+)="((?:[^"\\]|\\.)*)"/g;
    let m;
    while ((m = re.exec(text))) attrs[m[1]] = m[2].replace(/\\"/g, '"');
    return buildMeta(attrs.title, attrs.artist, attrs.url);
}

function buildMeta(title, artist, urlText) {
    title = (title || "").trim();
    artist = (artist || "").trim();

    const inner = {};
    const re = /(\w+)="([^"]*)"/g;
    let m;
    while ((m = re.exec(urlText || ""))) inner[m[1]] = m[2];

    // 커버: 스트림에 실린 주소(https로, 큰 크기로) → 없으면 곡 ID(TPID)로 iHeart 카탈로그 이미지
    let cover = inner.amgArtworkURL && inner.amgArtworkURL !== "null" ? inner.amgArtworkURL : "";
    cover = cover.replace("http://", "https://").replace("fit(200,200)", "fit(600,600)").replace(/([?&]w=)\d+/, "$1600");
    if (!cover && inner.TPID && inner.TPID !== "0") {
        cover = "https://i.iheart.com/v3/catalog/track/" + inner.TPID + "?ops=fit(600,600)";
    }

    return {
        title,
        artist: fixCase(artist),
        isMusic: (inner.song_spot === "M" || inner.song_spot === "F") && !!title && !!artist,
        cover
    };
}

// "LEWIS CAPALDI" 처럼 전부 대문자로 오는 가수명을 "Lewis Capaldi" 로
function fixCase(s) {
    if (!s || /[a-z]/.test(s) || !/[A-Z]{3}/.test(s)) return s;
    return s.toLowerCase().replace(/(^|[\s\-\/&(])([a-z])/g, (_, p, c) => p + c.toUpperCase());
}

// 같은 곡 판별용 키: 스트림과 웹 API의 표기 차이를 무시
// 예) "Blank Space" = "Blank Space (Taylor's Version)", "Blink 182" = "blink-182"
// 예) "Wanted" = "The Wanted", "Maroon 5 / Christina Aguilera" = "Maroon 5"
function trackKey(title, artist) {
    const norm = s => (s || "").toLowerCase().replace(/\(.*?\)|\[.*?\]/g, "").replace(/[^a-z0-9가-힣]/g, "");
    const mainArtist = (artist || "").toLowerCase()
        .split(/\s*(?:\/|,|&|\bfeat\.?|\bft\.?|\bwith\b|\bx\b)\s*/)[0]
        .replace(/^the\s+/, "");
    return norm(title) + "|" + norm(mainArtist);
}

function onStreamMeta(meta) {
    if (meta && meta.isMusic) {
        const key = trackKey(meta.title, meta.artist);
        if (key === currentKey) return;
        if (currentSong && currentSong.key !== key) pushHistory(currentSong);
        currentSong = { key, title: meta.title, artist: meta.artist, cover: meta.cover, time: Date.now() };
        currentKey = key;
        updateCurrent(currentSong);
        renderHistory();
    } else {
        // 멘트/광고 구간: 방송국 정보 표시 (곡 기록에는 넣지 않음)
        // 방송국 ID("104.3 MYfm / 90s to Now")만 문구를 쓰고, 광고·교통·날씨 등은 "On Air"
        const isStationId = meta && /myfm/i.test(meta.title);
        const subtitle = isStationId && meta.artist ? meta.artist : "On Air";
        if (currentKey === "station|" + subtitle) return;
        currentKey = "station|" + subtitle;
        updateCurrent({ title: STATION_NAME, artist: subtitle, cover: "" });
    }
}

// ---------------------------------------------------------------
// 화면 갱신
// ---------------------------------------------------------------
function updateCurrent(track) {
    document.getElementById("title").innerText = track.title;
    document.getElementById("artist").innerText = track.artist;

    setImage(document.getElementById("cover"), track.cover);

    // 잠금화면 메타데이터 지원
    if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: track.artist,
            album: STATION_NAME,
            artwork: [{ src: track.cover || STATION_LOGO, sizes: "600x600" }]
        });
    }
}

// 커버가 없거나 깨지면 방송국 이미지로 대체
function setImage(img, src) {
    img.onerror = () => { img.onerror = null; img.src = STATION_LOGO; };
    img.src = src || STATION_LOGO;
}

function pushHistory(song) {
    localHistory = localHistory.filter(s => s.key !== song.key);
    localHistory.unshift(song);
    localHistory = localHistory.slice(0, HISTORY_SIZE * 2);
    saveLocalHistory();
}

function renderHistory() {
    // 직접 들은 곡 + 웹 API 목록을 재생 시각 순으로 합침 (같은 곡은 직접 들은 쪽 우선)
    // 웹사이트에 안 올라오는 광고 시간 노래(F)는 직접 들은 기록에만 있음
    const byKey = new Map();
    for (const t of apiTracks) byKey.set(t.key, t);
    for (const s of localHistory) byKey.set(s.key, s);
    if (currentSong) byKey.delete(currentSong.key);

    const list = [...byKey.values()]
        .sort((a, b) => b.time - a.time)
        .slice(0, HISTORY_SIZE);

    const box = document.getElementById("historyList");
    box.innerHTML = "";
    list.forEach(track => {
        const item = document.createElement("div");
        item.className = "history-item";

        const img = document.createElement("img");
        setImage(img, track.cover);

        const info = document.createElement("div");
        info.className = "song-info";
        const t = document.createElement("div");
        t.className = "song-title";
        t.innerText = track.title;
        const a = document.createElement("div");
        a.className = "song-artist";
        a.innerText = track.artist;
        info.append(t, a);

        item.append(img, info);
        box.appendChild(item);
    });
}

async function loadApiHistory() {
    try {
        const res = await fetch(API_URL + "&t=" + Date.now());
        const json = await res.json();
        const tracks = json.data.sites.find.stream.amp.currentlyPlaying.tracks || [];
        apiTracks = tracks.map(t => ({
            key: trackKey(t.title, t.artist.artistName),
            title: t.title,
            artist: t.artist.artistName,
            cover: (t.imagePath || "").replace("http://", "https://"),
            time: (t.startTime || 0) * 1000
        }));
        renderHistory();
    } catch (e) {
        console.log("API error", e);
    }
}

// ---------------------------------------------------------------
// 재생 방식
//  A) hls.js : 지금 소리가 나는 조각의 곡 정보를 그대로 사용 (정확)
//  B) 아이폰/아이패드 기본 재생 : 잠금화면 백그라운드 재생을 위해 기본 플레이어 유지,
//     조각 안의 ID3 태그로 곡 정보를 받음 (정확). ID3 가 안 오면
//     재생 목록을 따로 읽어 "라이브에서 몇 초 뒤인지"로 지금 조각을 계산 (약 ±10초)
// ---------------------------------------------------------------
const isAppleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const canNativeHls = audio.canPlayType("application/vnd.apple.mpegurl") !== "";

function setupHlsJs() {
    const hls = new Hls();
    hls.loadSource(STREAM_URL);
    hls.attachMedia(audio);

    hls.on(Hls.Events.FRAG_CHANGED, (event, data) => {
        onStreamMeta(parseExtinf(data.frag.title));
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
    });
}

let mediaPlaylistUrl = "";

async function pollPlaylist() {
    try {
        if (!mediaPlaylistUrl) {
            const res = await fetch(STREAM_URL, { cache: "no-store" });
            const text = await res.text();
            const line = text.split("\n").map(s => s.trim()).find(s => s && !s.startsWith("#"));
            if (!line) return;
            mediaPlaylistUrl = new URL(line, res.url).href;
        }

        const res = await fetch(mediaPlaylistUrl, { cache: "no-store" });
        if (!res.ok) { mediaPlaylistUrl = ""; return; }
        const lines = (await res.text()).split("\n");

        const segs = [];
        for (const l of lines) {
            const m = l.match(/^#EXTINF:([\d.]+),?(.*)$/);
            if (m) segs.push({ dur: parseFloat(m[1]), meta: parseExtinf(m[2]) });
        }
        if (segs.length === 0) return;

        // 라이브 끝에서 몇 초 뒤를 재생 중인지
        let behind = 30;
        if (audio.seekable.length > 0) {
            behind = audio.seekable.end(audio.seekable.length - 1) - audio.currentTime;
        }

        let seg = segs[0];
        let t = 0;
        for (let i = segs.length - 1; i >= 0; i--) {
            t += segs[i].dur;
            if (t >= behind) { seg = segs[i]; break; }
        }
        lastSegs = segs;
        debugInfo.behind = behind.toFixed(1) + " (t=" + audio.currentTime.toFixed(1) +
            (audio.seekable.length ? " seek=" + audio.seekable.start(0).toFixed(1) + "~" +
            audio.seekable.end(audio.seekable.length - 1).toFixed(1) : " seek=none") + ")";
        debugInfo.est = seg.meta ? (seg.meta.isMusic ? "music " : "other ") + seg.meta.title : "empty";
        debugInfo.segs = segs.map(s => s.meta ? (s.meta.isMusic ? "M:" : "x:") + s.meta.title.slice(0, 12) : "-").join(" | ");

        // ID3 가 2분 넘게 안 오면 추정 방식으로 복귀
        if (id3Active && Date.now() - lastId3Time > 120000) id3Active = false;
        if (!id3Active) onStreamMeta(seg.meta);
    } catch (e) {
        console.log("playlist error", e);
    }
}

// Safari 기본 재생은 조각 안의 ID3 태그를 metadata 트랙의 cue 로 넘겨줌
// 제대로 해석될 때만 추정 대신 이 값을 사용 (소리와 정확히 일치)
let id3Active = false;
let lastId3Time = 0;
let lastSegs = [];

// cue 값이 문자열이 아닐 수도 있어서(ArrayBuffer 등) 모두 문자열로 변환
function cueText(x) {
    if (x == null) return "";
    if (typeof x === "string") return x;
    try {
        if (x instanceof ArrayBuffer) x = new Uint8Array(x);
        if (ArrayBuffer.isView(x)) {
            return new TextDecoder("utf-8").decode(x).replace(/[\u0000-\u0003]/g, " ").trim();
        }
    } catch (e) {}
    return "";
}

function readId3Cues(track) {
    const cues = track.activeCues;
    if (!cues || cues.length === 0) return;
    const f = {};
    for (const cue of cues) {
        const v = cue.value;
        if (!v || !v.key) continue;
        f[v.key] = [v.info, v.data].map(cueText).join(" ").trim();
    }
    debugInfo.id3Count = (debugInfo.id3Count || 0) + 1;
    debugInfo.id3 = JSON.stringify(f).slice(0, 300);
    if (!f.TIT2 && !f.WXXX) return;

    // 1순위: 재생 목록에서 같은 제목의 조각 정보 (해석이 검증된 EXTINF 사용)
    let meta = null;
    if (f.TIT2) {
        const title = f.TIT2.toLowerCase();
        const seg = lastSegs.slice().reverse().find(s => s.meta && s.meta.title.toLowerCase() === title);
        if (seg) meta = seg.meta;
    }
    // 2순위: ID3 자체 해석
    if (!meta && /song_spot=/.test(f.WXXX || "")) {
        meta = buildMeta(f.TIT2, f.TPE1, f.WXXX);
    }
    debugInfo.id3Meta = meta ? (meta.isMusic ? "music " : "other ") + meta.title : "unparsed";

    // 노래로 확인된 경우만 ID3 를 사용. 광고/멘트/해석 실패는 추정 방식에 맡김
    // (ID3 해석이 틀려 화면이 "On Air" 에 고정되는 일을 막기 위함)
    if (!meta || !meta.isMusic) {
        id3Active = false;
        return;
    }

    id3Active = true;
    lastId3Time = Date.now();
    onStreamMeta(meta);
}

function watchId3() {
    const hook = track => {
        if (track.kind !== "metadata") return;
        track.mode = "hidden";
        track.addEventListener("cuechange", () => readId3Cues(track));
    };
    for (const track of audio.textTracks) hook(track);
    audio.textTracks.addEventListener("addtrack", e => hook(e.track));
}

function setupNative() {
    audio.src = STREAM_URL;
    watchId3();
    pollPlaylist();
    setInterval(pollPlaylist, 5000);
}

if (window.Hls && Hls.isSupported() && !isAppleMobile) {
    debugInfo.mode = "hls.js";
    setupHlsJs();
} else if (canNativeHls) {
    debugInfo.mode = "native";
    setupNative();
} else if (window.Hls && Hls.isSupported()) {
    debugInfo.mode = "hls.js";
    setupHlsJs();
}

loadApiHistory();
setInterval(loadApiHistory, 3 * 60 * 1000);

// ---------------------------------------------------------------
// 문제 확인용: 주소 끝에 ?debug 를 붙이면 화면 아래에 내부 상태 표시
// ---------------------------------------------------------------
if (location.search.includes("debug")) {
    const box = document.createElement("pre");
    box.style.cssText = "text-align:left;font-size:11px;color:#8f8;white-space:pre-wrap;word-break:break-all;margin:0 0 10px;";
    document.querySelector(".container").prepend(box);
    setInterval(() => {
        box.textContent = [
            "mode: " + debugInfo.mode + "  paused: " + audio.paused + "  tracks: " + audio.textTracks.length,
            "id3Active: " + id3Active + "  cues: " + (debugInfo.id3Count || 0) + "  id3Meta: " + (debugInfo.id3Meta || "-"),
            "behind: " + debugInfo.behind,
            "estimate: " + (debugInfo.est || "-"),
            "segs: " + (debugInfo.segs || "-"),
            "shown: " + currentKey,
            "id3: " + (debugInfo.id3 || "-")
        ].join("\n");
    }, 1000);
}

// ---------------------------------------------------------------
// 재생 시작 / 자동재생
// ---------------------------------------------------------------
function startPlayback() {
    audio.play().then(() => {
        document.getElementById("overlay").style.display = "none";
    }).catch(() => {
        console.log("Autoplay blocked");
    });
}

// 새로고침 시 자동 재생 시도
window.addEventListener("load", () => {
    audio.play().then(() => {
        document.getElementById("overlay").style.display = "none";
    }).catch(() => {
        document.getElementById("overlay").style.display = "flex";
    });
});

</script>

</body>
</html>
